- name: almaty-cool
  production: false
  servicePlan: B1
  platform:
    dbProvider: AzureSQL Database
    imageRepository: virtopaasregistrymain.azurecr.io/saas/platform
    imageTag: latest-stable
    sqlReplica: false
    redis:
      service: redis-dev-vc01-redis-cluster.redis-cluster:6379
    config:
      APPINSIGHTS_INSTRUMENTATIONKEY: a2d5234e-7f26-43d2-b34d-a0d5e607fcd0
  storefront:
    enabled: false
    config:
      VirtoCommerce__DefaultStore: B2B-store
      VirtoCommerce__Endpoint__Password: store
      Swagger__UI__Enable: true
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: true
      DOTNET_USE_POLLING_FILE_WATCHER: true
    themes:
      B2B-store: https://github.com/VirtoCommerce/vc-frontend/releases/download/2.42.0/vc-theme-b2b-vue-2.42.0.zip
  customApps:
    app1:
      enabled: false
    app2:
      enabled: false
  routes:
  - host: almaty-cool-storefront.virtocloud.dev
    root: B2B-store
    ssl: true
    paths:
    - path: /xapi
      route: platform
    - path: /files
      route: platform
    - path: /connect/token
      route: platform
    - path: /graphql
      route: platform
    - path: /revoke/token
      route: platform
    - path: /api/files
      route: platform
  version: 3.238